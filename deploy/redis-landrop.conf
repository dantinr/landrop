# Install as /etc/redis/landrop.conf, owned by root:redis, mode 0640.
# Add a generated requirepass locally; never commit the actual password.
bind 127.0.0.1 ::1
port 6380
protected-mode yes
daemonize no
dir /run/landrop-redis
save ""
appendonly no
maxmemory-policy noeviction
loglevel warning
logfile ""
slowlog-log-slower-than -1
slowlog-max-len 0
latency-monitor-threshold 0
