# Include this file from the http block in nginx.conf.
# Requires a certificate issued for icloud.aicsi.cn.
server {
    listen 80;
    listen [::]:80;
    server_name icloud.aicsi.cn;

    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    access_log /var/log/nginx/icloud.aicsi.access.log;
    error_log /var/log/nginx/icloud.aicsi.error.log;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://icloud.aicsi.cn$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name icloud.aicsi.cn;

    server_tokens off;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    access_log /var/log/nginx/icloud.aicsi.access.log;
    error_log /var/log/nginx/icloud.aicsi.error.log;

    ssl_certificate /etc/letsencrypt/live/icloud.aicsi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/icloud.aicsi.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 20m;
    client_body_timeout 1d;
    send_timeout 1d;

    error_page 413 = @upload_too_large;
    location @upload_too_large {
        default_type application/json;
        charset utf-8;
        return 413 '{"error":"FILE_TOO_LARGE","message":"单个文件不能超过 20 MB"}';
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /ws {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 1d;
        proxy_send_timeout 1d;
    }
}
